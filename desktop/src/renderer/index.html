<!doctype html>
<html lang="zh-CN" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Taskproof</title>
    <!--
      The renderer only ever talks to its own bundle and to the loopback API on
      a port chosen at launch, so `connect-src` has to allow 127.0.0.1 on any
      port. Without that clause every request to the API is blocked by the CSP
      and the app looks like it simply has no data.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:*"
    />
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
