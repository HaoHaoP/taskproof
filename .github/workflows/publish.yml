name: publish

# Publish to PyPI when a release is published. Trusted Publishing (OIDC) is used:
# no API token is stored anywhere — PyPI trusts this repository and this filename.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The wheel carries the browser board from src/taskproof/web/, which is a
      # generated artefact: build it first, or the sdist/wheel ship with no board.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci --prefix desktop
      - run: npm run build:web --prefix desktop
      - run: python -m pip install --upgrade build
      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
