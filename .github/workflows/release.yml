name: release

# Cut a release by pushing a tag like `v0.1.0`. The same pipeline can be run by
# hand from the Actions tab (workflow_dispatch) — pick the tag ref when you do.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Create/update the GitHub Release and attach every artefact to it.
permissions:
  contents: write

# The bundled Python runtime is pinned inside `desktop/scripts/fetch-runtime.mjs`
# (RELEASE = '20261003'); the cache keys below use the same fixed number so a
# 24-45 MB download is not repeated on every run.
jobs:
  # ---------------------------------------------------------------------------
  # Command-line distribution: sdist + wheel. `taskproof` is pure stdlib, so a
  # plain `python -m build` on a stock runner is all there is to it.
  # ---------------------------------------------------------------------------
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The wheel carries the browser board from src/taskproof/web/, which is a
      # generated artefact. Build it from the renderer source first, or the
      # sdist/wheel ship with no board at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci --prefix desktop
      - run: npm run build:web --prefix desktop

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: upload python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # macOS: Apple silicon only. There is deliberately no x64 and no universal
  # build — macOS 28 drops Rosetta — so `--arm64` is the whole story here.
  # ---------------------------------------------------------------------------
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: cache bundled python runtime
        uses: actions/cache@v4
        with:
          path: desktop/build/cache
          key: python-runtime-20261003-mac-arm64

      - run: npm ci

      - name: fetch bundled python runtime (mac-arm64)
        run: npm run runtime:fetch -- --target mac-arm64

      - run: npm run build

      - name: package (dmg + zip)
        run: npx electron-builder --mac --arm64 --publish never

      - name: upload mac installers
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  # ---------------------------------------------------------------------------
  # Windows: NSIS x64. Built on a native runner because the NSIS cross-build
  # needs wine + Rosetta, which no Mac runner offers.
  # ---------------------------------------------------------------------------
  win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: cache bundled python runtime
        uses: actions/cache@v4
        with:
          path: desktop/build/cache
          key: python-runtime-20261003-win-x64

      - run: npm ci

      - name: fetch bundled python runtime (win-x64)
        run: npm run runtime:fetch -- --target win-x64

      - run: npm run build

      - name: package (nsis x64)
        run: npx electron-builder --win --x64 --publish never

      - name: upload windows installer
        uses: actions/upload-artifact@v4
        with:
          name: win-dist
          if-no-files-found: error
          path: desktop/dist/*.exe

  # ---------------------------------------------------------------------------
  # Linux: AppImage + deb, x64, on a native runner for the usual reasons
  # (AppImage tooling and the deb helpers do not cross-compile cleanly).
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: cache bundled python runtime
        uses: actions/cache@v4
        with:
          path: desktop/build/cache
          key: python-runtime-20261003-linux-x64

      - run: npm ci

      - name: fetch bundled python runtime (linux-x64)
        run: npm run runtime:fetch -- --target linux-x64

      - run: npm run build

      - name: package (AppImage + deb)
        run: npx electron-builder --linux --x64 --publish never

      - name: upload linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  # ---------------------------------------------------------------------------
  # Publish: runs only after every build job succeeds (needs: all of them), so
  # a failure anywhere means no Release is created or half-updated.
  # ---------------------------------------------------------------------------
  release:
    needs: [python, mac, win, linux]
    runs-on: ubuntu-latest
    # `contents: write` to create the Release; `actions: write` to dispatch the
    # publish workflow in the last step below (a job-level block replaces the
    # workflow-level one, so both have to be listed).
    permissions:
      contents: write
      actions: write
    steps:
      - name: download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: list assets
        run: ls -lh release-assets

      - name: create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: taskproof ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
          body: |
            **Version / 版本:** `${{ github.ref_name }}`

            #### What's new / 更新内容

            **English**

            - **The board's time range now scopes the projects, not only the cards.** Picking
              today / 7d / 30d used to narrow the cards while every registered project kept its
              row, its option in the multi-select, and its all-time tallies -- a row could read
              "8 lanes / 111 tasks" over a single card. The rows, the option list, the
              "all / none" arithmetic and each row's lane and task counts now come from the
              cards inside the range. `all` is unchanged: the whole registry, registry order.
            - **The mast tallies count the board's set.** They used to read the fetched page
              (`store.tasks.length`), so `range=today` claimed 200 tasks over seven cards on
              screen. All three now run the same filter the matrix runs, and "failed" reuses the
              contract's last column instead of restating the status list.
            - **`check-card.py` runs on every card, not only the visual ones.** Three
              sandbox-feasibility checks join the four reference checks: acceptance may not write
              outside the checkout (`--lane`, skipped when the lane is unknown), may not drive a
              browser without a budget and a stop-loss line, and "write the test, do not touch the
              source" beside a test command now warns instead of blocking -- a card whose subject
              *is* the test is legitimate. Exit codes keep their meaning: 0 fire, 1 do not fire.
            - **The ledger rotation tests no longer hard-code a month.** They pinned `2026-10` as
              "the current month" while `rotate()` reads the wall clock, so the suite went red the
              moment November started. They now derive the month (and a month well outside the
              retention window) from `month_key()`.

            **中文**

            - **看板的时间范围现在管的是项目，不只是卡片。** 选「今天 / 7 天 / 30 天」以前只筛卡片：
              每个注册项目照样占一行、照样出现在项目多选里，行上还挂着整库聚合的数字 —— 一行可能写着
              「8 条道 / 111 个任务」而实际只有 1 张卡。现在行、选项列表、「全选 / 清空」的口径、以及每行的
              道数与任务数，都从范围内的卡片算出来。`all` 不变：整份注册表，注册顺序。
            - **右上角三个数数的是看板上的集合。** 以前读的是取回的行数（`store.tasks.length`），所以范围选
              「今天」时写着 200 个任务、而屏幕上只有 7 张卡。现在三个数都跑看板用的同一个过滤器，「未通过」
              复用契约最后一列，不再自己列状态名。
            - **`check-card.py` 现在对每张卡都跑，不再只管观感卡。** 四条参照物检查之外加了三条沙箱可行性
              检查：验收不许写到检出之外（要 `--lane`，道未知时标不适用）、不许把浏览器量测当验收（除
              非卡里写了预算与止损），以及「只写测试、别动源码」配测试命令时只告警不拦车 —— 卡本身就该改
              测试的那种是正当的。退出码语义不变：0 发车、1 不许发车。
            - **账本轮转测试不再把月份写死。** 它们把 `2026-10` 当成「本月」，而 `rotate()` 读的是真实时钟，
              于是日历一进 11 月整套测试就红。现在从 `month_key()` 推导本月（以及一个远在保留窗口之外的月份）。

      # `release: published` cannot route here on its own: this Release is created
      # with the run's automatic GITHUB_TOKEN, and events raised by that token do
      # not start further workflows. `workflow_dispatch` is the documented
      # exception, so the publish workflow is dispatched on purpose — on the tag's
      # ref, so PyPI gets exactly the tagged tree, and only for a real release: an
      # `-rc` dry run keeps its artefacts away from the public index.
      - name: publish to PyPI
        if: ${{ !contains(github.ref_name, '-rc') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--repo` is not optional: this job never checks the repository out
        # (it only downloads the built artefacts), and `gh` needs a repo
        # context -- without it the call dies on "not a git repository" and
        # the release ships without ever reaching PyPI.
        run: gh workflow run publish.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"
