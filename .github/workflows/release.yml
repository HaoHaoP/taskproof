name: release

# Cut a release by pushing a tag like `v0.1.0`. The same pipeline can be run by
# hand from the Actions tab (workflow_dispatch) — pick the tag ref when you do.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Create/update the GitHub Release and attach every artefact to it.
permissions:
  contents: write

# The bundled Python runtime is pinned inside `desktop/scripts/fetch-runtime.mjs`
# (RELEASE = '20261003'); the cache keys below use the same fixed number so a
# 24-45 MB download is not repeated on every run.
jobs:
  # ---------------------------------------------------------------------------
  # Command-line distribution: sdist + wheel. `taskproof` is pure stdlib, so a
  # plain `python -m build` on a stock runner is all there is to it.
  # ---------------------------------------------------------------------------
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The wheel carries the browser board from src/taskproof/web/, which is a
      # generated artefact. Build it from the renderer source first, or the
      # sdist/wheel ship with no board at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci --prefix desktop
      - run: npm run build:web --prefix desktop

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: upload python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # macOS: Apple silicon only. There is deliberately no x64 and no universal
  # build — macOS 28 drops Rosetta — so `--arm64` is the whole story here.
  # ---------------------------------------------------------------------------
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: cache bundled python runtime
        uses: actions/cache@v4
        with:
          path: desktop/build/cache
          key: python-runtime-20261003-mac-arm64

      - run: npm ci

      - name: fetch bundled python runtime (mac-arm64)
        run: npm run runtime:fetch -- --target mac-arm64

      - run: npm run build

      - name: package (dmg + zip)
        run: npx electron-builder --mac --arm64 --publish never

      - name: upload mac installers
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  # ---------------------------------------------------------------------------
  # Windows: NSIS x64. Built on a native runner because the NSIS cross-build
  # needs wine + Rosetta, which no Mac runner offers.
  # ---------------------------------------------------------------------------
  win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: cache bundled python runtime
        uses: actions/cache@v4
        with:
          path: desktop/build/cache
          key: python-runtime-20261003-win-x64

      - run: npm ci

      - name: fetch bundled python runtime (win-x64)
        run: npm run runtime:fetch -- --target win-x64

      - run: npm run build

      - name: package (nsis x64)
        run: npx electron-builder --win --x64 --publish never

      - name: upload windows installer
        uses: actions/upload-artifact@v4
        with:
          name: win-dist
          if-no-files-found: error
          path: desktop/dist/*.exe

  # ---------------------------------------------------------------------------
  # Linux: AppImage + deb, x64, on a native runner for the usual reasons
  # (AppImage tooling and the deb helpers do not cross-compile cleanly).
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: cache bundled python runtime
        uses: actions/cache@v4
        with:
          path: desktop/build/cache
          key: python-runtime-20261003-linux-x64

      - run: npm ci

      - name: fetch bundled python runtime (linux-x64)
        run: npm run runtime:fetch -- --target linux-x64

      - run: npm run build

      - name: package (AppImage + deb)
        run: npx electron-builder --linux --x64 --publish never

      - name: upload linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  # ---------------------------------------------------------------------------
  # Publish: runs only after every build job succeeds (needs: all of them), so
  # a failure anywhere means no Release is created or half-updated.
  # ---------------------------------------------------------------------------
  release:
    needs: [python, mac, win, linux]
    runs-on: ubuntu-latest
    # `contents: write` to create the Release; `actions: write` to dispatch the
    # publish workflow in the last step below (a job-level block replaces the
    # workflow-level one, so both have to be listed).
    permissions:
      contents: write
      actions: write
    steps:
      - name: download all artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: list assets
        run: ls -lh release-assets

      - name: create or update the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: taskproof ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
          body: |
            **Version / 版本:** `${{ github.ref_name }}`

            #### What's new / 更新内容

            **English**

            - **The ledger now records whether a task needs human attention.** Disposition
              appears as a DISPO column in task listings, `--dispo` filters the ledger by it,
              and `wait` uses four distinct exit codes to tell you whether work is finished,
              waiting for review, blocked, or timed out.
            - **Acceptance criteria are frozen when a card is dispatched.** Each task keeps the
              twelve dispatch-time facts, including the card fingerprint, lane, branch, and
              acceptance command. Changing the registry mid-run no longer changes the verdict
              for a running card; a mismatch is recorded as `mandate_drift`, while the card
              continues against its original criteria. `verify --current` explicitly opts into
              the present registry values.
            - **The same card cannot be dispatched twice.** A duplicate fingerprint exits with
              code 76, leaves no ledger row, and does not consume a concurrency slot. `--force`
              clearly means redispatch and records `duplicate_of` on the event. `check-card.py`
              now warns when a literal date appears in the card body.

            **中文**

            - **账本现在会记下每个任务要不要人看。** 任务列表新增 DISPO 列显示 disposition，
              `--dispo` 可按它过滤账本，`wait` 用四种不同退出码区分「已完成 / 待人看 / 阻塞 / 超时」。
            - **发车时就把验收判据冻结下来。** 每个任务会保留卡指纹、道、分支、验收命令等十二项发车时的
              信息，中途修改注册表不再改写正在运行的卡的判定；对不上会记一条 `mandate_drift`，但仍按发车时
              的判据继续跑。`verify --current` 则明确要求按现在的注册表值验收。
            - **同一张卡不会被重复派发。** 撞指纹时返回 76，不写账本，也不占并发位；`--force` 明确表示
              要重派，并在事件里记下 `duplicate_of`。`check-card.py` 遇到卡文正文里的日期会给出 WARN。

      # `release: published` cannot route here on its own: this Release is created
      # with the run's automatic GITHUB_TOKEN, and events raised by that token do
      # not start further workflows. `workflow_dispatch` is the documented
      # exception, so the publish workflow is dispatched on purpose — on the tag's
      # ref, so PyPI gets exactly the tagged tree, and only for a real release: an
      # `-rc` dry run keeps its artefacts away from the public index.
      - name: publish to PyPI
        if: ${{ !contains(github.ref_name, '-rc') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--repo` is not optional: this job never checks the repository out
        # (it only downloads the built artefacts), and `gh` needs a repo
        # context -- without it the call dies on "not a git repository" and
        # the release ships without ever reaching PyPI.
        run: gh workflow run publish.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"
