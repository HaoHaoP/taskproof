name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      # The generic rules only: the organisation-specific words live outside the
      # repository on purpose (a scanner that listed them would be the leak).
      - name: employer-asset scan
        run: python3 tools/scan_assets.py

      # The frontend must never hand-copy the status words. This fails the build
      # if contract/enums.json and the Python constants have drifted apart --
      # drift here means tasks silently vanish from the board.
      - name: enum contract is in sync with the Python constants
        run: PYTHONPATH=src python tools/gen_contract.py --check

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:web

      # The browser board serves the same renderer the Electron window shows,
      # so the committed build under src/taskproof/web/ must equal what the
      # source produces. We just rebuilt it; fail if regenerating it changed
      # anything -- drift here means the browser board and the desktop
      # interface are no longer the same code (the enum-contract discipline).
      - name: web build is in sync with the renderer source
        run: |
          if [ -n "$(git -C .. status --porcelain -- src/taskproof/web)" ]; then
            echo "::error::src/taskproof/web is stale; run 'npm run build:web' in desktop/ and commit the result"
            git -C .. status --porcelain -- src/taskproof/web
            git -C .. --no-pager diff --stat -- src/taskproof/web
            exit 1
          fi
