  <text x="125" y="329" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">解析结构化结果</text>
  <text x="125" y="343.94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">契约失败即记 failed，</text>
  <text x="125" y="358.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">不靠 stdout 猜结论</text>
  <rect x="230" y="280" width="170" height="104" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
  <text x="315" y="311.83" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#0969da" text-anchor="middle" font-weight="600">⑥</text>
  <text x="315" y="329" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">差分 + 禁改闸门</text>
  <text x="315" y="343.94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">跑前/跑后快照比对；</text>
  <text x="315" y="358.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">越界记 blocked</text>
  <rect x="420" y="280" width="170" height="104" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
  <text x="505" y="311.83" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#0969da" text-anchor="middle" font-weight="600">⑦</text>
  <text x="505" y="329" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">独立验收</text>
  <text x="505" y="343.94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">verifying；命令由</text>
  <text x="505" y="358.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">注册表现读</text>
  <rect x="610" y="280" width="170" height="104" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
  <text x="695" y="311.83" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#0969da" text-anchor="middle" font-weight="600">⑧</text>
  <text x="695" y="329" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">终态与释放</text>
  <text x="695" y="343.94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">写终态行 + 事件；</text>
  <text x="695" y="358.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">finally 释放锁</text>
