  <text x="315" y="111.83" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#0969da" text-anchor="middle" font-weight="600">②</text>
  <text x="315" y="129" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">连接与建号</text>
  <text x="315" y="143.94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">建库、分配任务 id、</text>
  <text x="315" y="158.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">记录本次派发参数</text>
  <rect x="420" y="80" width="170" height="104" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
  <text x="505" y="111.83" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#0969da" text-anchor="middle" font-weight="600">③</text>
  <text x="505" y="129" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">取锁</text>
  <text x="505" y="143.94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">同 group 串行 + 全局 cap；</text>
  <text x="505" y="158.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">拒绝即退出 75</text>
