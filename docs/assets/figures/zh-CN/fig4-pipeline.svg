  <text x="785" y="481.33" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">验收超时落 failed（exit 记 NULL），不是 timeout 状态</text>
  <rect x="40" y="525" width="1000" height="62" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="540" y="559.36" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">锁的边界：③ 取锁、⑨ finally 释放；进程崩掉不靠人工解锁 —— claims 带 expires_at，过期由下一个派发回收</text>
