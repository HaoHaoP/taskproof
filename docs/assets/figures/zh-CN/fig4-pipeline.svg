  <text x="275" y="466.33" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">闸门判越界时，验收尚未开始 —— 卡落 blocked，</text>
  <text x="275" y="481.33" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">verify_exit 为 NULL，需要人工补跑 taskproof verify</text>
  <rect x="530" y="415" width="510" height="92" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
  <text x="785" y="448" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">预算的分工</text>
