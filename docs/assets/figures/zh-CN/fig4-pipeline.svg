  <text x="885" y="129" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="600">跑适配器</text>
  <text x="885" y="143.94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">Popen(new session)、</text>
  <text x="885" y="158.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">日志边跑边落盘、记 pgid</text>
  <rect x="40" y="280" width="170" height="104" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
