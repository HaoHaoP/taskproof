<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730">
  <rect width="1080" height="730" fill="white"/>
  <text x="24" y="34" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Figure 6  Timeouts: where the value comes from, and when to stop</text>
  <text x="40" y="78" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">A  Where the value comes from today</text>
  <rect x="40" y="92" width="300" height="54" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="190.0" y="114.61" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">[defaults] timeout = 1800</text>
  <text x="190.0" y="130.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">the registry default</text>
  <rect x="40" y="162" width="300" height="54" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="190.0" y="184.61" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">run --timeout N</text>
  <text x="190.0" y="200.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">one-off override, recorded in started</text>
  <rect x="40" y="232" width="300" height="66" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="190.0" y="253.22" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#cf222e" text-anchor="middle" font-weight="600">[[taskgroup]] timeout = 2700 / 5400</text>
  <text x="190.0" y="268.94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#cf222e" text-anchor="middle" font-weight="400">22 declarations in one workspace</text>
  <text x="190.0" y="283.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#cf222e" text-anchor="middle" font-weight="400">no such field on Taskgroup: dropped silently</text>
  <rect x="470" y="140" width="190" height="90" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="565.0" y="172.22" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">dispatch.py:201</text>
  <text x="565.0" y="189.33" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">the only place it is read</text>
  <text x="565.0" y="204.33" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">reg.timeout</text>
  <rect x="750" y="140" width="290" height="90" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="895.0" y="172.22" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="600">adapter.timeout → proc.wait(timeout)</text>
  <text x="895.0" y="189.33" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">on expiry killpg: SIGTERM → 5s → SIGKILL</text>
  <text x="895.0" y="204.33" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">only this run's own process group</text>
  <line x1="342" y1="119" x2="468" y2="165" stroke="#0969da" stroke-width="1.3"/>
  <polygon points="468,165 458.10543623122777,165.85884097812126 460.9861320120096,157.96823949163203" fill="#0969da"/>
  <line x1="342" y1="189" x2="468" y2="185" stroke="#0969da" stroke-width="1.3"/>
  <polygon points="468,185 459.1377979190478,189.48345561775352 458.87126552563564,181.08768522527242" fill="#0969da"/>
  <line x1="342" y1="265" x2="468" y2="215" stroke="#cf222e" stroke-width="1.3" stroke-dasharray="6 4"/>
  <polygon points="468,215 461.183734784756,222.22347066966117 458.08543241419056,214.41574869583624" fill="#cf222e"/>
  <rect x="389.5" y="220.5" width="31.0" height="17.5" rx="2" fill="white" stroke="none" stroke-width="1.2"/>
  <text x="405.0" y="232.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#cf222e" text-anchor="middle" font-weight="400">broken link</text>
  <line x1="662" y1="185" x2="748" y2="185" stroke="#0969da" stroke-width="1.3"/>
  <polygon points="748,185 739.0,189.2 739.0,180.8" fill="#0969da"/>
  <rect x="647.2375" y="165.5" width="115.52500000000003" height="17.5" rx="2" fill="white" stroke="none" stroke-width="1.2"/>
  <text x="705.0" y="177.0" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0969da" text-anchor="middle" font-weight="400">effective_timeout</text>
  <text x="40" y="350" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">B  Where the value should come from</text>
  <rect x="40" y="364" width="300" height="54" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="190.0" y="386.61" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">--timeout N</text>
  <text x="190.0" y="402.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">one-off, wins over everything</text>
  <rect x="370" y="364" width="300" height="54" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="520.0" y="386.61" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">lane.timeout (a new field)</text>
  <text x="520.0" y="402.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">a per-lane budget that makes the 22 real</text>
  <rect x="700" y="364" width="340" height="54" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="870.0" y="386.61" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">[defaults] timeout = 1800</text>
  <text x="870.0" y="402.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">the fallback, recorded with its source</text>
  <line x1="342" y1="391" x2="368" y2="391" stroke="#1a7f37" stroke-width="1.3"/>
  <polygon points="368,391 359.0,395.2 359.0,386.8" fill="#1a7f37"/>
  <line x1="672" y1="391" x2="698" y2="391" stroke="#1a7f37" stroke-width="1.3"/>
  <polygon points="698,391 689.0,395.2 689.0,386.8" fill="#1a7f37"/>
  <text x="40" y="444" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6e7781" text-anchor="start" font-weight="400">The event stream gains timeout_source, shaped like cap_source: a value is always shown with where it came from</text>
  <text x="40" y="492" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2328" text-anchor="start" font-weight="600">C  When to stop</text>
  <line x1="200" y1="590" x2="660" y2="590" stroke="#8c959f" stroke-width="1.2"/>
  <text x="200" y="624" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="600">today: wall clock only</text>
  <text x="200" y="610" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="start" font-weight="400">t=0</text>
  <line x1="430.0" y1="568" x2="430.0" y2="612" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="436.0" y="634" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="start" font-weight="600">900s</text>
  <line x1="660.0" y1="568" x2="660.0" y2="612" stroke="#cf222e" stroke-width="1.4"/>
  <text x="654.0" y="560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#cf222e" text-anchor="end" font-weight="600">1800s: the process tree dies on the clock</text>
  <line x1="200" y1="680" x2="660" y2="680" stroke="#8c959f" stroke-width="1.2"/>
  <text x="200" y="714" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="600">proposed: idle watchdog + the wall clock</text>
  <text x="200" y="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="start" font-weight="400">t=0</text>
  <line x1="324.2" y1="658" x2="324.2" y2="702" stroke="#1a7f37" stroke-width="1.4"/>
  <text x="330.2" y="650" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#1a7f37" text-anchor="start" font-weight="600">480s: log and tree both silent</text>
  <line x1="660.0" y1="658" x2="660.0" y2="702" stroke="#6e7781" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="654.0" y="650" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="end" font-weight="600">1800s: backstop</text>
  <rect x="700" y="545" width="340" height="110" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="870.0" y="580.61" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="600">Why the log alone will not do</text>
  <text x="870.0" y="597.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">a cold build or a large download can run</text>
  <text x="870.0" y="611.94" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">for minutes without output, so the check has to</text>
  <text x="870.0" y="626.44" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="10.5" fill="#6e7781" text-anchor="middle" font-weight="400">include the tree: only both silent is a stall</text>
</svg>
