<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="740" viewBox="0 0 1010 740">
  <rect width="1010" height="740" fill="white"/>
  <text x="24" y="34" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Figure 3  The task lifecycle</text>
  <rect x="70" y="120" width="180" height="80" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="160" y="147.2" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">running</text>
  <text x="160" y="167.08" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">the adapter's group runs</text>
  <text x="160" y="182.08" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">the hard timeout is ticking</text>
  <rect x="420" y="120" width="180" height="80" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
  <text x="510" y="147.2" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">verifying</text>
  <text x="510" y="167.08" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#6e7781" text-anchor="middle" font-weight="400">the acceptance window</text>
  <text x="510" y="182.08" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#cf222e" text-anchor="middle" font-weight="400">shares the task's budget</text>
  <rect x="770" y="70" width="200" height="70" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="870" y="99.92" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">done</text>
  <text x="870" y="118.58" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle" font-weight="400">acceptance passed (or SKIPPED)</text>
  <rect x="770" y="160" width="200" height="70" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
  <text x="870" y="189.92" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">failed</text>
  <text x="870" y="208.58" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#cf222e" text-anchor="middle" font-weight="400">adapter failed / acceptance red</text>
  <rect x="770" y="250" width="200" height="70" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
  <text x="870" y="279.92" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">blocked</text>
  <text x="870" y="298.58" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#9a6700" text-anchor="middle" font-weight="400">protected path moved: review</text>
  <rect x="770" y="340" width="200" height="70" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.2"/>
  <text x="870" y="369.92" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">timeout</text>
  <text x="870" y="388.58" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#cf222e" text-anchor="middle" font-weight="400">hard timeout, no acceptance</text>
  <rect x="770" y="430" width="200" height="70" rx="6" fill="#fff8c5" stroke="#9a6700" stroke-width="1.2"/>
  <text x="870" y="459.92" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">cancelled</text>
  <text x="870" y="478.58" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#9a6700" text-anchor="middle" font-weight="400">stopped by hand, group killed</text>
  <line x1="252" y1="150" x2="418" y2="150" stroke="#0969da" stroke-width="1.3"/>
  <polygon points="418,150 409,154.2 409,145.8" fill="#0969da"/>
  <rect x="302.25" y="130.5" width="65.5" height="17.5" rx="2" fill="white" stroke="none" stroke-width="1.2"/>
  <text x="335" y="142" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0969da" text-anchor="middle" font-weight="400">the adapter exits</text>
  <line x1="602" y1="130" x2="768" y2="105" stroke="#1a7f37" stroke-width="1.3"/>
  <polygon points="768,105 759.7258,110.4935 758.4749,102.1871" fill="#1a7f37"/>
  <rect x="640.75" y="98" width="88.5" height="17.5" rx="2" fill="white" stroke="none" stroke-width="1.2"/>
  <text x="685" y="109.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a7f37" text-anchor="middle" font-weight="400">gate + acceptance pass</text>
  <line x1="602" y1="150" x2="768" y2="195" stroke="#cf222e" stroke-width="1.3"/>
  <polygon points="768,195 758.2146,196.6989 760.4124,188.5915" fill="#cf222e"/>
  <rect x="658" y="153" width="54" height="17.5" rx="2" fill="white" stroke="none" stroke-width="1.2"/>
  <text x="685" y="164.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#cf222e" text-anchor="middle" font-weight="400">acceptance is red</text>
  <line x1="602" y1="178" x2="768" y2="285" stroke="#9a6700" stroke-width="1.3"/>
  <polygon points="768,285 758.1598,283.6542 762.7108,276.5938" fill="#9a6700"/>
  <rect x="640.75" y="212" width="88.5" height="17.5" rx="2" fill="white" stroke="none" stroke-width="1.2"/>
  <text x="685" y="223.5" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#9a6700" text-anchor="middle" font-weight="400">a protected path moved</text>
  <line x1="160" y1="202" x2="160" y2="375" stroke="#cf222e" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="160" y1="375" x2="768" y2="375" stroke="#cf222e" stroke-width="1.3" stroke-dasharray="6 4"/>
  <polygon points="768,375 759,379.2 759,370.8" fill="#cf222e"/>
  <rect x="414" y="355.5" width="100" height="17.5" rx="2" fill="white" stroke="none" stroke-width="1.2"/>
  <text x="464" y="367" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#cf222e" text-anchor="middle" font-weight="400">hard timeout: acceptance skipped</text>
  <line x1="510" y1="202" x2="510" y2="470" stroke="#9a6700" stroke-width="1.3" stroke-dasharray="6 4"/>
  <line x1="510" y1="470" x2="768" y2="470" stroke="#9a6700" stroke-width="1.3" stroke-dasharray="6 4"/>
  <polygon points="768,470 759,474.2 759,465.8" fill="#9a6700"/>
  <rect x="570.025" y="450.5" width="137.95" height="17.5" rx="2" fill="white" stroke="none" stroke-width="1.2"/>
  <text x="639" y="462" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#9a6700" text-anchor="middle" font-weight="400">cancel: this run's group only</text>
  <rect x="70" y="545" width="560" height="110" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
  <text x="350" y="569.14" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">Human sign-off: accept &lt;id&gt;</text>
  <text x="350" y="588.97" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="400">blocked clears with no note; failed needs --note</text>
  <text x="350" y="605.47" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#cf222e" text-anchor="middle" font-weight="400">timeout / cancelled / done are refused</text>
  <text x="350" y="621.97" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6e7781" text-anchor="middle" font-weight="400">accept registers a human judgement: never re-runs acceptance, never rewrites verify_*</text>
  <text x="350" y="638.47" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#6e7781" text-anchor="middle" font-weight="400">rerun &lt;id&gt; opens a fresh card; the ledger links rerun_of / rerun_as</text>
  <rect x="70" y="675" width="890" height="44" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="515" y="700.36" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#6e7781" text-anchor="middle" font-weight="400">an unknown status is always rendered, never dropped: a new state must not hide a card</text>
</svg>
