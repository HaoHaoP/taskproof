[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskproof"
# The version lives in `src/taskproof/__init__.py` and nowhere else. The 0.1.1
# release bumped this file by hand and left that one behind, so the wheel's
# metadata said 0.1.1 while `taskproof --version` still printed 0.1.0.
dynamic = ["version"]
description = "A conveyor belt for AI coding agents: dispatch, independently verify, record."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HaoHaoP", email = "HaoHaoP@HaoHaoP.com" }]
keywords = ["ai-agents", "orchestration", "verification", "codex", "claude-code", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/HaoHaoP/taskproof"
Issues = "https://github.com/HaoHaoP/taskproof/issues"

[project.scripts]
taskproof = "taskproof.cli:main"

[tool.setuptools.dynamic]
# The one source of the number is the module attribute itself.
version = { attr = "taskproof.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taskproof = ["web/**/*", "sql/*.sql", "schemas/*.json"]
